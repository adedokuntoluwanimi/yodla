<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Contact Yodla — orders, gifts, delivery, and the shelf.">
  <title>Contact — Yodla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <header class="site-header" data-site-header></header>
  <main class="shell contact-desk">
    <header class="contact-desk__intro">
      <span class="eyebrow">Yodla support</span>
      <h1>Contact Yodla</h1>
      <p>Get help with an order, delivery, or a general question.</p>
    </header>
    <div class="contact-desk__layout">
      <section class="contact-desk__message" aria-labelledby="contact-message-heading">
        <h2 id="contact-message-heading">Send us a message</h2>
        <form class="yodla-form" data-contact-form>
          <div class="field-pair">
            <label>Topic<select name="intent" required><option value="">Choose a topic</option><option>Orders</option><option>Gifts</option><option>Delivery</option><option>Press</option><option>Other</option></select></label>
            <label>Subject<input name="subject" maxlength="160" required></label>
          </div>
          <label>Message<textarea name="message" required rows="5" maxlength="2000"></textarea></label>
          <fieldset><legend>Where should we reply?</legend><div class="field-pair">
            <label>Name<input name="name" required autocomplete="name" maxlength="100"></label>
            <label>Email<input name="email" type="email" required autocomplete="email" maxlength="160"></label>
          </div></fieldset>
          <label class="hamper-option"><input type="checkbox" name="subscribe"><span>Send me new stories from the Journal</span></label>
          <button class="button button--dark" type="submit">Send message <svg class="ui-icon" aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg></button>
          <div data-contact-status role="status"></div>
        </form>
      </section>
      <aside class="contact-desk__aside" aria-labelledby="contact-direct-heading">
        <span class="eyebrow">Direct line</span>
        <h2 id="contact-direct-heading"><a href="mailto:hello@yodla.ng">hello@yodla.ng</a></h2>
        <a class="contact-desk__link" href="help.html#delivery">Delivery help <span aria-hidden="true">+</span></a>
        <a class="contact-desk__link" href="gifting.html">Explore gift hampers <span aria-hidden="true">+</span></a>
        <a class="contact-desk__link" href="https://www.instagram.com/yodla.ng/" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">+</span></a>
      </aside>
    </div>
  </main>
  <footer data-site-footer></footer>
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
